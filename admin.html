<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrativo — Madam Maison du Soleil by Magda</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --rosa:#E7B7C1; --rosa-soft:#F6E3E7; --rosa-bg:#F8DFE5; --marfil:#FBE8EC;
    --gold:#C9A84C; --gold-soft:#E4CE93;
    --pearl:#FCEEF1; --ink:#3A2E2A; --ink-soft:#7A6A63; --line:#EADFE0;
    --ok:#5C8A6B; --ok-bg:#E7F1E8; --danger:#B5564B; --danger-bg:#F7E6E3;
  }
  html,body { min-height:100%; }
  body { font-family:'Montserrat',sans-serif; color:var(--ink); background:var(--pearl); line-height:1.5; }
  h1,h2,h3,h4 { font-family:'Playfair Display',serif; font-weight:600; line-height:1.2; }
  button, input, select, textarea { font-family:inherit; font-size:1rem; }
  img { max-width:100%; display:block; }
  [hidden] { display:none !important; }

  /* ---------- Login ---------- */
  #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--rosa-bg); }
  .login-card { background:#fff; border-radius:14px; padding:44px 36px; max-width:380px; width:100%; box-shadow:0 20px 50px rgba(58,46,42,.12); text-align:center; }
  .login-card .crown { font-size:1.6rem; color:var(--gold); }
  .login-card .name { font-size:1.4rem; margin:8px 0 2px; }
  .login-card .sub { font-size:.6rem; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:28px; display:block; }
  .field { text-align:left; margin-bottom:18px; }
  .field label { display:block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin-bottom:7px; }
  .field input, .field select, .field textarea { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--pearl); color:var(--ink); outline:none; transition:border-color .2s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--gold); }
  .field textarea { resize:vertical; min-height:88px; line-height:1.45; }
  .hint { font-size:.7rem; color:var(--ink-soft); margin-top:5px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 28px; border-radius:50px; font-size:.76rem; letter-spacing:.14em; text-transform:uppercase; font-weight:600; cursor:pointer; border:none; transition:transform .15s, box-shadow .15s, opacity .15s; }
  .btn-gold { background:linear-gradient(135deg,var(--gold),var(--gold-soft)); color:#fff; box-shadow:0 10px 24px rgba(201,168,76,.32); }
  .btn-gold:hover:not(:disabled) { transform:translateY(-2px); }
  .btn-outline { background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-outline:hover:not(:disabled) { border-color:var(--ink); }
  .btn-danger { background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn-danger:hover:not(:disabled) { background:var(--danger); color:#fff; }
  .btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .btn-block { width:100%; }
  .error-msg { color:var(--danger); font-size:.8rem; margin-top:14px; text-align:left; }
  .error-msg:empty { display:none; }

  /* ---------- App shell ---------- */
  #app-screen { min-height:100vh; }
  .topbar { position:sticky; top:0; z-index:50; background:rgba(252,238,241,.97); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:16px 5%; gap:16px; flex-wrap:wrap; }
  .topbar .brand { display:flex; align-items:center; gap:10px; }
  .topbar .brand .crown { color:var(--gold); font-size:1.2rem; }
  .topbar .brand .name { font-size:1.05rem; }
  .topbar .brand .tag { font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:600; }

  .toolbar { max-width:1200px; margin:0 auto; padding:28px 5% 0; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:50px; padding:8px 18px; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600; color:var(--ink); cursor:pointer; transition:all .2s; }
  .chip:hover, .chip.active { background:var(--gold); color:#fff; border-color:var(--gold); }

  main { max-width:1200px; margin:0 auto; padding:20px 5% 80px; }
  .state-msg { text-align:center; padding:60px 20px; color:var(--ink-soft); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:22px; margin-top:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .2s; }
  .card:hover { box-shadow:0 12px 28px rgba(58,46,42,.08); }
  .thumb { aspect-ratio:3/4; background:var(--marfil); position:relative; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; text-align:center; padding:10px; }
  .ph-a{background:#F6E3E7;} .ph-b{background:#E9F0F1;} .ph-c{background:#F1E6D9;} .ph-d{background:#F3EAD3;}
  .badge-status { position:absolute; top:10px; left:10px; font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; padding:4px 10px; border-radius:50px; }
  .badge-ok { background:var(--ok-bg); color:var(--ok); }
  .badge-out { background:var(--danger-bg); color:var(--danger); }
  .badge-star { position:absolute; top:10px; right:10px; background:var(--gold); color:#fff; font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; padding:4px 10px; border-radius:50px; }
  .card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-body h4 { font-size:.92rem; font-weight:600; }
  .card-cat { font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .card-price { color:var(--gold); font-weight:600; font-size:.92rem; }
  .card-toggle { display:flex; align-items:center; justify-content:space-between; margin-top:6px; padding-top:10px; border-top:1px solid var(--line); font-size:.72rem; color:var(--ink-soft); }
  .card-toggle + .card-toggle { margin-top:0; border-top:none; padding-top:6px; }
  .card-view { font-size:.68rem; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; margin-top:8px; align-self:center; }
  .card-view:hover { color:var(--gold); }
  .switch { position:relative; width:38px; height:22px; flex-shrink:0; }
  .switch input { opacity:0; width:100%; height:100%; margin:0; cursor:pointer; position:absolute; z-index:1; }
  .switch .track { position:absolute; inset:0; background:var(--line); border-radius:20px; transition:background .2s; }
  .switch .thumb-dot { position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .switch input:checked + .track { background:var(--danger); }
  .switch.gold input:checked + .track { background:var(--gold); }
  .switch input:checked + .track + .thumb-dot { transform:translateX(16px); }
  .card-actions { display:flex; gap:8px; margin-top:10px; }
  .card-actions .btn { flex:1; padding:9px 10px; font-size:.64rem; }

  .fab-row { display:flex; gap:12px; }

  /* ---------- Modal ---------- */
  .overlay { position:fixed; inset:0; background:rgba(58,46,42,.45); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; }
  .modal { background:#fff; border-radius:14px; max-width:520px; width:100%; padding:32px; margin:auto; }
  .modal h3 { margin-bottom:22px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .preview-box { aspect-ratio:3/4; width:140px; border-radius:8px; overflow:hidden; background:var(--marfil); border:1px solid var(--line); position:relative; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:.66rem; text-align:center; padding:8px; }
  .preview-box img { width:100%; height:100%; object-fit:cover; }
  .upload-row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .upload-controls { flex:1; min-width:180px; }
  .upload-controls .btn { margin-top:10px; padding:8px 16px; font-size:.62rem; }
  .toggles { display:flex; gap:24px; flex-wrap:wrap; margin:18px 0 6px; }
  .toggle-field { display:flex; align-items:center; gap:10px; font-size:.78rem; }
  .modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:26px; }
  .status-line { font-size:.76rem; color:var(--ink-soft); margin-top:8px; min-height:1.1em; }

  /* ---------- Toasts ---------- */
  #toast-container { position:fixed; bottom:22px; right:22px; z-index:400; display:flex; flex-direction:column; gap:10px; max-width:320px; }
  .toast { padding:13px 18px; border-radius:10px; font-size:.82rem; box-shadow:0 12px 28px rgba(0,0,0,.18); animation:toast-in .2s ease-out; }
  .toast-success { background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok); }
  .toast-error { background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger); }
  @keyframes toast-in { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  @media (max-width:600px) {
    .modal { padding:24px 18px; }
    .row2 { grid-template-columns:1fr; }
    .toolbar { flex-direction:column; align-items:stretch; }
    .fab-row .btn { width:100%; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <form class="login-card" id="login-form">
    <div class="crown">♛</div>
    <div class="name">Madam Maison du Soleil</div>
    <span class="sub">Panel Administrativo</span>
    <div class="field">
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-gold btn-block" id="login-btn">Entrar</button>
    <div class="error-msg" id="login-error"></div>
  </form>
</div>

<div id="app-screen" hidden>
  <div class="topbar">
    <div class="brand"><span class="crown">♛</span><span><span class="name">Madam Maison du Soleil</span><br><span class="tag">Panel Administrativo</span></span></div>
    <button class="btn btn-outline" id="logout-btn">Cerrar Sesión</button>
  </div>

  <div class="toolbar">
    <div class="filters">
      <span class="chip active" data-cat="">Todos</span>
      <span class="chip" data-cat="trajes">Trajes</span>
      <span class="chip" data-cat="esenciales">Esenciales</span>
    </div>
    <div class="fab-row">
      <button class="btn btn-gold" id="add-btn">+ Agregar Producto</button>
    </div>
  </div>

  <main>
    <div id="list-state" class="state-msg">Cargando productos…</div>
    <div class="grid" id="product-grid" hidden></div>
  </main>
</div>

<div class="overlay" id="modal-overlay" hidden>
  <form class="modal" id="product-form">
    <h3 id="modal-title">Agregar Producto</h3>

    <div class="field">
      <label for="f-nombre">Nombre</label>
      <input type="text" id="f-nombre" required maxlength="200">
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-precio">Precio (USD)</label>
        <input type="number" id="f-precio" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label for="f-orden">Orden (opcional)</label>
        <input type="number" id="f-orden" step="1" value="0">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-categoria">Categoría</label>
        <select id="f-categoria" required>
          <option value="" disabled>Selecciona…</option>
          <option value="trajes">Trajes de Baño</option>
          <option value="esenciales">Esenciales Invisibles</option>
        </select>
      </div>
      <div class="field">
        <label for="f-subcategoria">Subcategoría</label>
        <select id="f-subcategoria">
          <option value="">— Ninguna —</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="f-descripcion">Descripción (opcional)</label>
      <textarea id="f-descripcion" maxlength="2000" placeholder="Tela, corte, detalles… Si la dejas vacía se muestra un texto general de la Maison."></textarea>
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-colores">Colores (opcional)</label>
        <input type="text" id="f-colores" placeholder="Ej: Rosa, Negro">
        <div class="hint">Separados por coma.</div>
      </div>
      <div class="field">
        <label for="f-tallas">Tallas (opcional)</label>
        <input type="text" id="f-tallas" placeholder="Ej: S, M, L">
        <div class="hint" id="tallas-hint">Vacío = tallas por defecto.</div>
      </div>
    </div>

    <div class="field">
      <label for="f-etiqueta">Etiqueta en la foto (opcional)</label>
      <input type="text" id="f-etiqueta" list="etiquetas" maxlength="30" placeholder="Ej: Nuevo">
      <datalist id="etiquetas"><option value="Nuevo"><option value="Best Seller"><option value="Popular"><option value="Oferta"><option value="Edición Limitada"></datalist>
    </div>

    <div class="field">
      <label>Imagen del producto</label>
      <div class="upload-row">
        <div class="preview-box" id="preview-box">Sin imagen</div>
        <div class="upload-controls">
          <input type="file" id="f-imagen" accept="image/png, image/jpeg, image/webp">
          <div class="status-line" id="upload-status"></div>
          <button type="button" class="btn btn-outline" id="remove-img-btn" hidden>Quitar foto</button>
        </div>
      </div>
    </div>

    <div class="toggles">
      <label class="toggle-field"><input type="checkbox" id="f-agotado"> Agotado</label>
      <label class="toggle-field"><input type="checkbox" id="f-destacado"> Destacado (aparece en inicio)</label>
    </div>

    <div class="error-msg" id="form-error"></div>
    <div class="status-line" id="form-status"></div>

    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancel-btn">Cancelar</button>
      <button type="submit" class="btn btn-gold" id="save-btn">Guardar</button>
    </div>
  </form>
</div>

<div id="toast-container"></div>

<script>
(function () {
  'use strict';

  var CATEGORIES = {
    trajes: ['Bikinis', 'Enterizos', 'Cover-Ups', 'Resort Wear'],
    esenciales: ['Bras Adhesivos', 'Cubre-Pezones', 'Bikini Pads', 'Boob Tape'],
  };
  var CATEGORY_LABELS = { trajes: 'Trajes de Baño', esenciales: 'Esenciales Invisibles' };
  // Mismas tallas por defecto que assets/js/store.js
  var DEFAULT_SIZES = {
    'Bikinis': 'S, M, L', 'Enterizos': 'S, M, L', 'Cover-Ups': 'S, M, L', 'Resort Wear': 'S, M, L',
    'Bras Adhesivos': 'A, B, C, D', 'Cubre-Pezones': 'Talla única', 'Bikini Pads': 'M, L', 'Boob Tape': 'Talla única'
  };
  var PH_CLASSES = ['ph-a', 'ph-b', 'ph-c', 'ph-d'];

  var state = { products: [], filter: '', editingId: null, pendingImageUrl: null, uploading: false };

  var loginScreen = document.getElementById('login-screen');
  var appScreen = document.getElementById('app-screen');
  var loginForm = document.getElementById('login-form');
  var loginError = document.getElementById('login-error');
  var loginBtn = document.getElementById('login-btn');
  var logoutBtn = document.getElementById('logout-btn');
  var grid = document.getElementById('product-grid');
  var listState = document.getElementById('list-state');
  var addBtn = document.getElementById('add-btn');
  var overlay = document.getElementById('modal-overlay');
  var form = document.getElementById('product-form');
  var modalTitle = document.getElementById('modal-title');
  var cancelBtn = document.getElementById('cancel-btn');
  var saveBtn = document.getElementById('save-btn');
  var formError = document.getElementById('form-error');
  var formStatus = document.getElementById('form-status');
  var uploadStatus = document.getElementById('upload-status');
  var previewBox = document.getElementById('preview-box');
  var removeImgBtn = document.getElementById('remove-img-btn');
  var tallasHint = document.getElementById('tallas-hint');
  var fNombre = document.getElementById('f-nombre');
  var fPrecio = document.getElementById('f-precio');
  var fOrden = document.getElementById('f-orden');
  var fCategoria = document.getElementById('f-categoria');
  var fSubcategoria = document.getElementById('f-subcategoria');
  var fDescripcion = document.getElementById('f-descripcion');
  var fColores = document.getElementById('f-colores');
  var fTallas = document.getElementById('f-tallas');
  var fEtiqueta = document.getElementById('f-etiqueta');
  var fImagen = document.getElementById('f-imagen');
  var fAgotado = document.getElementById('f-agotado');
  var fDestacado = document.getElementById('f-destacado');

  function toast(message, type) {
    var el = document.createElement('div');
    el.className = 'toast toast-' + (type || 'success');
    el.textContent = message;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(function () { el.remove(); }, 3500);
  }

  function money(n) { return '$' + Number(n).toFixed(2); }

  // fetch + JSON; si la sesión expiró vuelve al login.
  function api(url, options) {
    return fetch(url, Object.assign({ cache: 'no-store' }, options || {}))
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.status === 401 && url.indexOf('/api/admin/login') !== 0) {
            closeModal();
            showLogin();
            loginError.textContent = 'Tu sesión expiró. Vuelve a entrar.';
          }
          if (!r.ok || !j.ok) throw new Error(j.error || 'Algo salió mal. Intenta de nuevo.');
          return j;
        });
      });
  }
  function jsonBody(method, payload) {
    return { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) };
  }

  // ---------- Auth ----------
  function showApp() { loginScreen.hidden = true; appScreen.hidden = false; loadProducts(); }
  function showLogin() { appScreen.hidden = true; loginScreen.hidden = false; }

  fetch('/api/admin/session', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (json) {
    if (json && json.authenticated) showApp(); else showLogin();
  }).catch(function () { showLogin(); });

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Entrando…';
    api('/api/admin/login', jsonBody('POST', { password: document.getElementById('login-password').value }))
      .then(function () {
        document.getElementById('login-password').value = '';
        showApp();
      })
      .catch(function (err) { loginError.textContent = err.message; })
      .finally(function () { loginBtn.disabled = false; loginBtn.textContent = 'Entrar'; });
  });

  logoutBtn.addEventListener('click', function () {
    fetch('/api/admin/logout', { method: 'POST' }).finally(showLogin);
  });

  // ---------- List ----------
  document.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelector('.chip.active').classList.remove('active');
      chip.classList.add('active');
      state.filter = chip.dataset.cat || '';
      renderList();
    });
  });

  function loadProducts() {
    listState.hidden = false;
    listState.textContent = 'Cargando productos…';
    grid.hidden = true;
    api('/api/admin/products').then(function (json) {
      state.products = json.products || [];
      renderList();
    }).catch(function (err) {
      listState.textContent = 'Error al cargar productos: ' + err.message;
    });
  }

  function renderList() {
    var items = state.filter ? state.products.filter(function (p) { return p.categoria === state.filter; }) : state.products;
    if (!items.length) {
      grid.hidden = true;
      listState.hidden = false;
      listState.textContent = 'No hay productos todavía. Usa "Agregar Producto" para crear el primero.';
      return;
    }
    listState.hidden = true;
    grid.hidden = false;
    grid.innerHTML = '';
    items.forEach(function (p, i) {
      grid.appendChild(renderCard(p, i));
    });
  }

  function switchRow(label, checked, gold, onChange) {
    var row = document.createElement('div');
    row.className = 'card-toggle';
    var text = document.createElement('span');
    text.textContent = label;
    var sw = document.createElement('label');
    sw.className = 'switch' + (gold ? ' gold' : '');
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = checked;
    cb.setAttribute('aria-label', label);
    cb.addEventListener('change', function () { onChange(cb); });
    sw.appendChild(cb);
    var track = document.createElement('span'); track.className = 'track'; sw.appendChild(track);
    var dot = document.createElement('span'); dot.className = 'thumb-dot'; sw.appendChild(dot);
    row.appendChild(text);
    row.appendChild(sw);
    return row;
  }

  function renderCard(p, i) {
    var card = document.createElement('div');
    card.className = 'card';

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    if (p.imagen_url) {
      var img = document.createElement('img');
      img.src = p.imagen_url; img.alt = p.nombre; img.loading = 'lazy';
      thumb.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'ph ' + PH_CLASSES[i % PH_CLASSES.length];
      ph.textContent = 'Sin foto';
      thumb.appendChild(ph);
    }
    var statusBadge = document.createElement('span');
    statusBadge.className = 'badge-status ' + (p.agotado ? 'badge-out' : 'badge-ok');
    statusBadge.textContent = p.agotado ? 'Agotado' : 'Disponible';
    thumb.appendChild(statusBadge);
    if (p.destacado) {
      var star = document.createElement('span');
      star.className = 'badge-star';
      star.textContent = '★ Destacado';
      thumb.appendChild(star);
    }
    card.appendChild(thumb);

    var body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML =
      '<div class="card-cat">' + escapeHtml(CATEGORY_LABELS[p.categoria] || p.categoria) + (p.subcategoria ? ' · ' + escapeHtml(p.subcategoria) : '') + '</div>' +
      '<h4>' + escapeHtml(p.nombre) + '</h4>' +
      '<div class="card-price">' + money(p.precio) + '</div>';

    body.appendChild(switchRow('Agotado', !!p.agotado, false, function (cb) {
      quickToggle(p, 'agotado', cb, cb.checked ? 'Marcado como agotado.' : 'Marcado como disponible.');
    }));
    body.appendChild(switchRow('Destacado en inicio', !!p.destacado, true, function (cb) {
      quickToggle(p, 'destacado', cb, cb.checked ? 'Ahora aparece en el inicio.' : 'Ya no está destacado.');
    }));

    var actions = document.createElement('div');
    actions.className = 'card-actions';
    var editBtn = document.createElement('button');
    editBtn.type = 'button'; editBtn.className = 'btn btn-outline'; editBtn.textContent = 'Editar';
    editBtn.addEventListener('click', function () { openModal(p); });
    var delBtn = document.createElement('button');
    delBtn.type = 'button'; delBtn.className = 'btn btn-danger'; delBtn.textContent = 'Eliminar';
    delBtn.addEventListener('click', function () { deleteProduct(p); });
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    body.appendChild(actions);

    var view = document.createElement('a');
    view.className = 'card-view';
    view.href = '/producto?id=' + encodeURIComponent(p.id);
    view.target = '_blank';
    view.rel = 'noopener';
    view.textContent = 'Ver en la tienda ↗';
    body.appendChild(view);

    card.appendChild(body);
    return card;
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function quickToggle(p, field, checkboxEl, okMessage) {
    checkboxEl.disabled = true;
    var payload = Object.assign({}, p);
    payload[field] = checkboxEl.checked;
    api('/api/admin/products', jsonBody('PUT', payload))
      .then(function (res) {
        Object.assign(p, res.product || payload);
        toast(okMessage, 'success');
        renderList();
      })
      .catch(function (err) {
        checkboxEl.checked = !checkboxEl.checked;
        checkboxEl.disabled = false;
        toast(err.message, 'error');
      });
  }

  function deleteProduct(p) {
    if (!confirm('¿Eliminar "' + p.nombre + '"? Esta acción no se puede deshacer.')) return;
    api('/api/admin/products?id=' + encodeURIComponent(p.id), { method: 'DELETE' })
      .then(function () {
        state.products = state.products.filter(function (x) { return x.id !== p.id; });
        toast('Producto eliminado.', 'success');
        renderList();
      })
      .catch(function (err) { toast(err.message, 'error'); });
  }

  // ---------- Modal ----------
  function populateSubcategorias(categoria, selected) {
    fSubcategoria.innerHTML = '<option value="">— Ninguna —</option>';
    (CATEGORIES[categoria] || []).forEach(function (sub) {
      var opt = document.createElement('option');
      opt.value = sub; opt.textContent = sub;
      if (sub === selected) opt.selected = true;
      fSubcategoria.appendChild(opt);
    });
    fSubcategoria.disabled = !categoria;
    updateTallasHint();
  }

  function updateTallasHint() {
    var def = DEFAULT_SIZES[fSubcategoria.value] || (fCategoria.value === 'esenciales' ? 'Talla única' : 'S, M, L');
    tallasHint.textContent = 'Vacío = ' + def + '.';
  }

  fCategoria.addEventListener('change', function () { populateSubcategorias(fCategoria.value, null); });
  fSubcategoria.addEventListener('change', updateTallasHint);

  function resetPreview(url) {
    if (url) {
      previewBox.innerHTML = '';
      var img = document.createElement('img');
      img.src = url;
      img.alt = 'Vista previa';
      previewBox.appendChild(img);
    } else {
      previewBox.textContent = 'Sin imagen';
    }
    removeImgBtn.hidden = !url;
  }

  function setUploading(on) {
    state.uploading = on;
    saveBtn.disabled = on;
    saveBtn.textContent = on ? 'Subiendo foto…' : 'Guardar';
  }

  function openModal(product) {
    formError.textContent = '';
    formStatus.textContent = '';
    uploadStatus.textContent = '';
    fImagen.value = '';
    setUploading(false);
    state.editingId = product ? product.id : null;
    state.pendingImageUrl = product ? (product.imagen_url || null) : null;
    modalTitle.textContent = product ? 'Editar Producto' : 'Agregar Producto';
    fNombre.value = product ? product.nombre : '';
    fPrecio.value = product ? product.precio : '';
    fOrden.value = product ? (product.orden || 0) : 0;
    fCategoria.value = product ? product.categoria : (state.filter || '');
    populateSubcategorias(fCategoria.value, product ? product.subcategoria : null);
    fDescripcion.value = product ? (product.descripcion || '') : '';
    fColores.value = product && product.colores ? product.colores.join(', ') : '';
    fTallas.value = product && product.tallas ? product.tallas.join(', ') : '';
    fEtiqueta.value = product ? (product.etiqueta || '') : '';
    fAgotado.checked = !!(product && product.agotado);
    fDestacado.checked = !!(product && product.destacado);
    resetPreview(state.pendingImageUrl);
    overlay.hidden = false;
    setTimeout(function () { fNombre.focus(); }, 30);
  }

  function closeModal() { overlay.hidden = true; }

  addBtn.addEventListener('click', function () { openModal(null); });
  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) closeModal(); });
  removeImgBtn.addEventListener('click', function () {
    state.pendingImageUrl = null;
    fImagen.value = '';
    uploadStatus.textContent = 'La foto se quitará al guardar.';
    resetPreview(null);
  });

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('No se pudo leer el archivo.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('El archivo no es una imagen válida.')); };
        img.onload = function () {
          var MAX_DIM = 1600;
          var width = img.width, height = img.height;
          if (width > MAX_DIM || height > MAX_DIM) {
            if (width >= height) { height = Math.round(height * (MAX_DIM / width)); width = MAX_DIM; }
            else { width = Math.round(width * (MAX_DIM / height)); height = MAX_DIM; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; // fondo blanco para PNG con transparencia
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  fImagen.addEventListener('change', function () {
    var file = fImagen.files[0];
    if (!file) return;
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
      toast('Formato no soportado. Usa JPG, PNG o WEBP.', 'error');
      fImagen.value = '';
      return;
    }
    var previousUrl = state.pendingImageUrl;
    setUploading(true);
    uploadStatus.textContent = 'Preparando foto…';
    compressImage(file).then(function (dataUrl) {
      resetPreview(dataUrl);
      uploadStatus.textContent = 'Subiendo foto…';
      return api('/api/admin/upload', jsonBody('POST', { contentType: 'image/jpeg', dataBase64: dataUrl.split(',')[1] }));
    }).then(function (res) {
      state.pendingImageUrl = res.url;
      uploadStatus.textContent = '✓ Foto lista. Ahora pulsa "Guardar".';
    }).catch(function (err) {
      state.pendingImageUrl = previousUrl;
      resetPreview(previousUrl);
      fImagen.value = '';
      uploadStatus.textContent = '';
      toast(err.message, 'error');
    }).finally(function () { setUploading(false); });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (state.uploading) return;
    formError.textContent = '';

    var payload = {
      nombre: fNombre.value.trim(),
      precio: Number(fPrecio.value),
      categoria: fCategoria.value,
      subcategoria: fSubcategoria.value || null,
      imagen_url: state.pendingImageUrl,
      descripcion: fDescripcion.value.trim(),
      colores: fColores.value,
      tallas: fTallas.value,
      etiqueta: fEtiqueta.value.trim(),
      agotado: fAgotado.checked,
      destacado: fDestacado.checked,
      orden: Number(fOrden.value) || 0,
    };

    if (!payload.nombre) { formError.textContent = 'Escribe el nombre del producto.'; return; }
    if (fPrecio.value === '' || !Number.isFinite(payload.precio) || payload.precio < 0) { formError.textContent = 'Escribe un precio válido (ej: 78 o 78.50).'; return; }
    if (!payload.categoria) { formError.textContent = 'Elige una categoría.'; return; }

    saveBtn.disabled = true;
    formStatus.textContent = 'Guardando…';

    var isEdit = !!state.editingId;
    if (isEdit) payload.id = state.editingId;

    api('/api/admin/products', jsonBody(isEdit ? 'PUT' : 'POST', payload))
      .then(function () {
        toast(isEdit ? 'Producto actualizado. Ya se ve en la tienda.' : 'Producto creado. Ya se ve en la tienda.', 'success');
        closeModal();
        loadProducts();
      })
      .catch(function (err) { formError.textContent = err.message; })
      .finally(function () { saveBtn.disabled = false; formStatus.textContent = ''; });
  });
})();
</script>
</body>
</html>
